[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asd4hri"
version = "0.0.0"
description = "A scalable Active Speaker Detection for Human-Robot Interaction"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Adrian Auer", email = "adrian.auer@dfki.de" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pypaz @ git+https://github.com/adriandavidauer/paz.git", #TODO: change after PR is merged and package released
    "dlib", # TODO: fix version or upper bound at least
    "keras==3.6.0", 
    "tqdm", # TODO: fix version or upper bound at least
    "onnxruntime<2.0", 
    "onnxruntime-gpu<2.0"

]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",  # For generating test coverage reports
    "black>=23.0.0",     # For code formatting
    "ruff>=0.16.0",      # For linting
    "interrogate>=1.7.0",
    "h5py",
    "scikit-learn",
    "tensorboard",
    "pandas",
    "wget",
    "yt-dlp"
]

[tool.setuptools.packages.find]
where = ["src"]  # Tells setuptools to look inside the src/ folder for packages
include = ["asd4hri*"]  # The asterisk ensures subpackages inside asd4hri are caught too

[tool.ruff.lint]
select = ["D", "DOC"]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = [
    "tests",
]
pythonpath = [
    "src",  # Ensures pytest can easily find modules during test discovery
]

[tool.ruff]
extend-exclude = ["src/TalkNet-ASD", "src/LR-ASD", "trial", "docker"]

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
ignore-private = true
ignore-module = false
fail-under = 0
exclude = ["src/TalkNet-ASD", "src/LR-ASD", "trial", "docker", "build"]
verbose = 1
