[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my_awesome_project"
version = "0.1.0"
description = "A brief description of my awesome Python project"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",  # TODO: add dependencies here
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",  # For generating test coverage reports
    "black>=23.0.0",     # For code formatting
]

[tool.setuptools.packages.find]
where = ["src"]  # Tells setuptools to look inside the src/ folder for packages

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = [
    "tests",
]
pythonpath = [
    "src",  # Ensures pytest can easily find modules during test discovery
]