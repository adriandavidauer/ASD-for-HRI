[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asd4hri"
version = "0.0.0"
description = "A scalable Active Speaker Detection for Human-Robot Interaction"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Adrian Auer", email = "adrian.auer@dfki.de" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pypaz @ git+https://github.com/adriandavidauer/paz.git", #TODO: change after PR is merged and package released
    "dlib", # TODO: fix version or upper bound at least
    "keras==3.6.0", 
    "opencv-python<5", # pypaz uses cv2.SOLVEPNP_UPNP, which OpenCV 5 removed
    "tqdm", # TODO: fix version or upper bound at least
    # Never install both: they share the `onnxruntime` import package and the CPU build overwrites
    # the GPU one. onnxruntime-gpu also ships the CPU provider; it has no ARM wheels (Raspberry Pi).
    "onnxruntime<2.0; platform_machine != 'x86_64'",
    "onnxruntime-gpu<2.0; platform_machine == 'x86_64'"

]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",  # For generating test coverage reports
    "black>=23.0.0",     # For code formatting
    "ruff==0.16.9",      # For linting; pinned (preview rules), keep in sync with .github/workflows/quality.yml
    "interrogate>=1.7.0",
    "h5py",
    "scikit-learn",
    "tensorboard",
    "pandas",
    "wget",
    "yt-dlp"
]
# Static docs build (griffe), no runtime deps needed: CI installs only this list.
docs = [
    "mkdocs<2",                # MkDocs 2 drops the plugin system that mkdocstrings and material need
    "mkdocs-material",
    "mkdocstrings[python]",
    "pymdown-extensions<12",   # 12.x breaks the code highlighting of mkdocstrings 1.0
    "mike",
]

[tool.setuptools.packages.find]
where = ["src"]  # Tells setuptools to look inside the src/ folder for packages
include = ["asd4hri*"]  # The asterisk ensures subpackages inside asd4hri are caught too

[tool.ruff.lint]
select = ["D", "DOC"]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = [
    "tests",
]
pythonpath = [
    "src",  # Ensures pytest can easily find modules during test discovery
]

[tool.ruff]
extend-exclude = ["src/TalkNet-ASD", "src/LR-ASD", "trial", "docker"]

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
ignore-private = true
ignore-module = false
fail-under = 0
exclude = ["src/TalkNet-ASD", "src/LR-ASD", "trial", "docker", "build"]
verbose = 1
