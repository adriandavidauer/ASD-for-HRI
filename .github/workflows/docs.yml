name: Docs

# Versions on GitHub Pages (gh-pages branch, managed by mike):
#   push to main  -> "dev"; it is also the default version until the first release
#   tag vX.Y.Z    -> "X.Y.Z" with the alias "latest", which becomes the default version
#   other branches -> strict build only, nothing is deployed
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Python 3.12 for tomllib. mkdocstrings reads the sources statically, so only the docs
      # extra is installed, not the package and its TensorFlow stack.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs extra
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['docs']))" > "$RUNNER_TEMP/docs-requirements.txt"
          pip install -r "$RUNNER_TEMP/docs-requirements.txt"

      # Also on main and tags: mike deploy has no --strict, so this is what catches broken docs.
      - name: Build
        run: mkdocs build --strict

      - name: Deploy
        if: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || echo "No gh-pages branch yet"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            mike deploy --push --update-aliases "${GITHUB_REF_NAME#v}" latest
            mike set-default --push latest
          else
            mike deploy --push dev
            mike list latest > /dev/null 2>&1 || mike set-default --push dev
          fi
