name: Quality

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install tools
        # Keep the ruff pin in sync with pyproject.toml: preview rules change between releases.
        run: pip install ruff==0.16.9 interrogate

      - name: Run ruff
        id: ruff
        run: |
          ruff check . --output-format json > ruff.json || true
          COUNT=$(jq length ruff.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Ruff D+DOC violations: $COUNT"
          ruff check . --output-format concise || true

      - name: Run interrogate
        id: docs
        run: |
          interrogate -c pyproject.toml --fail-under 0 -v > docs.txt || true
          cat docs.txt
          PCT=$(grep -oE '[0-9]+\.[0-9]+%' docs.txt | tail -1 | tr -d '%')
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "Docstring coverage: $PCT%"

      - name: Enforce ratchet
        run: |
          BASE_LINT=$(jq -r .ruff_violations .github/quality-baseline.json)
          BASE_DOCS=$(jq -r .doc_coverage .github/quality-baseline.json)
          LINT=${{ steps.ruff.outputs.count }}
          DOCS=${{ steps.docs.outputs.pct }}
          FAIL=0
          if [ "$LINT" -gt "$BASE_LINT" ]; then
            echo "::error::Ruff violations went up: $LINT > $BASE_LINT"; FAIL=1
          fi
          if awk "BEGIN{exit !($DOCS < $BASE_DOCS)}"; then
            echo "::error::Docstring coverage dropped: $DOCS% < $BASE_DOCS%"; FAIL=1
          fi
          if [ "$LINT" -lt "$BASE_LINT" ] || awk "BEGIN{exit !($DOCS > $BASE_DOCS)}"; then
            echo "::notice::Numbers improved — update .github/quality-baseline.json to lock it in."
          fi
          exit $FAIL

      # Runs even when the ratchet failed (but not when cancelled): the badges show the real
      # numbers, and the failed ratchet step still fails the job afterwards.
      - name: Update README badges
        id: badges
        if: ${{ !cancelled() }}
        env:
          LINT: ${{ steps.ruff.outputs.count }}
          DOCS: ${{ steps.docs.outputs.pct }}
        run: python .github/scripts/update_badges.py

      - name: Commit badges to main
        # Other branches only see the badges in the job log.
        if: ${{ !cancelled() && steps.badges.outcome == 'success' && github.ref == 'refs/heads/main' }}
        env:
          LINT: ${{ steps.ruff.outputs.count }}
          DOCS: ${{ steps.docs.outputs.pct }}
        run: bash .github/scripts/commit_badges.sh
